services:
  - type: static
    name: ai-battle-arena-frontend
    env: static
    rootDirectory: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # User will set this to the backend URL once backend is deployed

  - type: web
    name: ai-battle-arena-backend
    env: node
    rootDirectory: Backend
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: GOOGLE_API_KEY
        sync: false # Set via Render dashboard
      - key: MISTRAL_API_KEY
        sync: false # Set via Render dashboard
      - key: COHERE_API_KEY
        sync: false # Set via Render dashboard
